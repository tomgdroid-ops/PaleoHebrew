name: Android build

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build phone and watch debug APKs
        run: ./gradlew :app:assembleDebug :wear:assembleDebug --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug :wear:lintDebug
        continue-on-error: true

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: watch-apk
          path: android/wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error
